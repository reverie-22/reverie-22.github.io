<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-2XF1NZ6P8C"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-2XF1NZ6P8C');
  </script>  
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Visual Effects Reel</title>
  <style>
    :root {
      --bg: #f7f9fb;
      --surface: #ffffff;
      --text: #111827;
      --muted: #5b6472;
      --line: #dbe3ea;
      --accent: #569abd;
      --accent-dark: #447f9d;
      --accent-soft: #eaf4fa;
      --shadow: 0 16px 40px rgba(15, 23, 42, 0.08);
      --shadow-soft: 0 10px 26px rgba(15, 23, 42, 0.07);
      --radius-lg: 28px;
      --radius-md: 22px;
      --max: 1000px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      font-family: Inter, Arial, Helvetica, sans-serif;
      color: var(--text);
      background: var(--bg);
      line-height: 1.6;
    }

    a { color: inherit; text-decoration: none; }
    img, iframe { display: block; max-width: 100%; }
    .wrap { width: min(var(--max), calc(100% - 32px)); margin: 0 auto; }

    header {
      position: sticky;
      top: 0;
      z-index: 30;
      backdrop-filter: blur(12px);
      background: rgba(247,249,251,0.92);
      border-bottom: 1px solid rgba(219, 227, 234, 0.8);
    }

    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      min-height: 74px;
    }

    .brand {
      font-weight: 700;
      letter-spacing: 0.02em;
      font-size: 1.05rem;
    }

    .nav-links {
      display: flex;
      gap: 22px;
      align-items: center;
      flex-wrap: wrap;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .nav-links a:hover { color: var(--text); }

    .button {
      border: 1px solid var(--line);
      background: var(--surface);
      border-radius: 999px;
      padding: 10px 16px;
      font-size: 0.94rem;
      transition: 0.2s ease;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .button:hover {
      transform: translateY(-1px);
      box-shadow: var(--shadow-soft);
    }

    .page { padding: 42px 0 60px; }

    .project-shell {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
      padding: 34px;
      text-align: center;
    }

    .top-links {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 20px;
      justify-content: flex-start;
      text-align: left;
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--accent);
      background: var(--accent-soft);
      border-radius: 999px;
      padding: 7px 12px;
      font-size: 0.86rem;
      font-weight: 600;
      width: fit-content;
      margin-bottom: 18px;
      text-align: left;
    }

    h1 {
      margin: 0 0 14px;
      font-size: clamp(2rem, 4vw, 3rem);
      line-height: 1.08;
      letter-spacing: -0.03em;
    }

    .lead {
      margin: 0 auto 22px;
      color: var(--muted);
      font-size: 1.03rem;
      max-width: 68ch;
    }

    .bullet-list {
      display: inline-block;
      text-align: left;
      margin: 0 auto 26px;
      padding-left: 18px;
      color: var(--muted);
    }

    .bullet-list li { margin-bottom: 8px; }

    .section {
      margin-top: 30px;
      background: linear-gradient(135deg, #eef6fa, #ffffff 45%, #f6f9fc);
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      padding: 24px;
      text-align: center;
    }

    .video-frame {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      aspect-ratio: 16 / 9;
      border-radius: 18px;
      overflow: hidden;
      background: #111827;
      border: 1px solid var(--line);
      box-shadow: var(--shadow-soft);
    }

    .video-frame iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }

    .caption {
      margin-top: 12px;
      color: var(--muted);
      font-size: 0.94rem;
      text-align: center;
    }

    #upBtn {
      display: none;
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 99;
      border: none;
      outline: none;
      background-color: var(--accent);
      color: white;
      cursor: pointer;
      padding: 14px 16px;
      border-radius: 14px;
      box-shadow: 0 12px 24px rgba(86,154,189,0.28);
      font-size: 0.92rem;
      font-weight: 700;
    }

    #upBtn:hover { background-color: var(--accent-dark); }

    footer {
      padding: 24px 0 42px;
      color: var(--muted);
      text-align: center;
      font-size: 0.92rem;
    }

    @media (max-width: 720px) {
      .nav { min-height: 68px; }
      .nav-links { display: none; }
      .project-shell { padding: 22px; }
      .section { padding: 18px; }
      .wrap { width: min(var(--max), calc(100% - 20px)); }
    }
  

    /* Mobile navigation override: keeps the top menu on one compact row. */
    @media (max-width: 860px) {
      html { scroll-padding-top: 72px; }
      section { scroll-margin-top: 72px; }

      header {
        height: auto;
      }

      .nav {
        min-height: 56px !important;
        padding: 6px 0 !important;
        flex-direction: row !important;
        align-items: center !important;
        justify-content: space-between !important;
        gap: 14px !important;
      }

      .brand {
        font-size: 0.88rem !important;
        white-space: nowrap !important;
        flex-shrink: 0 !important;
      }

      .nav-links {
        display: flex !important;
        width: auto !important;
        flex: 1 !important;
        flex-direction: row !important;
        flex-wrap: nowrap !important;
        justify-content: flex-end !important;
        align-items: center !important;
        gap: 12px !important;
        font-size: 0.66rem !important;
        overflow-x: auto !important;
        white-space: nowrap !important;
        scrollbar-width: none !important;
      }

      .nav-links::-webkit-scrollbar {
        display: none;
      }

      .nav-links a {
        border: none !important;
        background: transparent !important;
        border-radius: 0 !important;
        padding: 0 !important;
        line-height: 1 !important;
        white-space: nowrap !important;
      }

      .nav-links .button {
        border: 1px solid var(--line) !important;
        background: var(--surface) !important;
        border-radius: 999px !important;
        padding: 5px 9px !important;
        font-size: 0.66rem !important;
        line-height: 1 !important;
        flex-shrink: 0 !important;
      }

      .page {
        padding-top: 24px !important;
      }
    }

  </style>
</head>
<body>
  <button onclick="topFunction()" id="upBtn" title="Go to top">△ Top</button>

  <header>
    <div class="wrap nav">
      <a href="../index.html"><div class="brand">MILIM LEE</div></a>
      <nav class="nav-links" aria-label="Primary">
        <a href="../index.html">Home</a>
        <a href="../index.html#projects">Technical Foundations</a>
        <a href="../index.html#contact">Contact</a>
      </nav>
    </div>
  </header>

  <main class="page">
    <div class="wrap">
      <article class="project-shell">
        <div class="top-links">
          <a class="button" href="../index.html">← Back to Home</a>
          <a class="button" href="../index.html#projects">Go to Technical Foundations</a>
        </div>

        <div class="eyebrow">Featured Work</div>
        <h1>Visual Effects Reel</h1>
        <p class="lead">
          A visual effects reel highlighting production work, real-time content,<br>and technical art contributions in interactive media.
        </p>
        <section class="section" aria-label="Visual Effects Reel video">
          <div class="video-frame">
            <iframe
              src="https://player.vimeo.com/video/1188856459?autoplay=1&loop=1&autopause=0"
              allow="autoplay; fullscreen; picture-in-picture"
              allowfullscreen
              title="Visual Effects Reel">
            </iframe>
          </div>
        </section>
      </article>
    </div>
  </main>

  <footer>
    © <span id="year"></span> Milim Lee. All rights reserved.
  </footer>

  <script>
    const upBtn = document.getElementById("upBtn");
    document.getElementById("year").textContent = new Date().getFullYear();

    window.onscroll = function() {
      scrollFunction();
    };

    function scrollFunction() {
      if (document.body.scrollTop > 200 || document.documentElement.scrollTop > 200) {
        upBtn.style.display = "block";
      } else {
        upBtn.style.display = "none";
      }
    }

    function topFunction() {
      document.body.scrollTop = 0;
      document.documentElement.scrollTop = 0;
    }
  </script>
</body>
</html>
